<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitted self-test</title>
<style>
  body { margin: 0; font: 14px/1.4 ui-monospace, Menlo, monospace; background: #f0efeb; color: #0c0c0c; display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  iframe { width: 390px; height: 844px; border: 2px solid #0c0c0c; background: #fff; flex: none; }
  ol { margin: 0; padding-left: 20px; min-width: 300px; } .ok { color: #1a7f37; } .bad { color: #c2341b; font-weight: 700; } h1 { font-size: 16px; margin: 0 0 8px; }
</style>
<!-- Taps through every screen of the real app at iPhone width (390px) and checks: nothing wider than the screen, the screen
     actually changed, sheets open, no errors. Open /selftest.html after a change; it runs on your real closet in this browser. -->
<iframe id="f" src="./"></iframe>
<div><h1 id="sum">Running…</h1><ol id="out"></ol></div>
<script type="module">
const f = document.getElementById('f'), out = document.getElementById('out'), wait = ms => new Promise(r => setTimeout(r, ms));
let fails = 0; const errors = [];
const log = (ok, msg) => { const li = document.createElement('li'); li.className = ok ? 'ok' : 'bad'; li.textContent = (ok ? '✓ ' : '✕ ') + msg; out.append(li); if (!ok) fails++; };
await new Promise(r => f.onload = r); await wait(1500);
const w = f.contentWindow, d = () => w.document;
w.addEventListener('error', e => errors.push(e.message)); w.addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
const fits = where => { const sw = d().documentElement.scrollWidth; log(sw <= 390, `${where}: ${sw}px wide`); const sh = d().getElementById('sheet'); if (sh.open) log(sh.scrollWidth <= 390, `${where} sheet: ${sh.scrollWidth}px wide`); };
const tap = sel => { const el = d().querySelector(sel); if (!el) { log(false, `missing ${sel}`); return false; } el.click(); return true; };
const close = async () => { const sh = d().getElementById('sheet'); if (sh.open) { sh.close(); await wait(300); } };
for (const [go, title] of [['today', 'Today'], ['closet', 'Closet'], ['build', 'Build'], ['outfits', 'Favorites'], ['me', 'Me']]) {
  tap(`nav [data-go="${go}"]`); await wait(900);
  const h = d().querySelector('main header h1')?.textContent; log(h === title, `${title} tab opens (got "${h}")`); fits(title);
}
tap('nav [data-go="today"]'); await wait(900);
log(!!d().querySelector('.dcard.slide, .empty'), 'Today shows its looks (or an empty state)'); { const im = [...d().querySelectorAll('.dcard img')]; log(im.every(i => i.complete && i.naturalWidth), `Today photos load (${im.filter(i => i.complete && i.naturalWidth).length}/${im.length})`); }
if (tap('[data-action="capsules"]')) { await wait(400); log(!!d().querySelector('.caprow'), 'Capsules sheet lists capsules'); fits('Capsules'); await close(); }
if (tap('[data-action="filters"]')) { await wait(400); fits('Filter'); await close(); }
tap('nav [data-go="closet"]'); await wait(900); { const im = [...d().querySelectorAll('main img')]; log(im.every(i => i.complete && i.naturalWidth), `Closet photos load (${im.filter(i => i.complete && i.naturalWidth).length}/${im.length})`); }
if (tap('.item[data-open]')) { await wait(500); log(!!d().querySelector('#sheet .pname'), 'A piece opens'); fits('Piece page'); await close(); }
tap('nav [data-go="build"]'); await wait(900); log(!!d().querySelector('.stage'), 'Builder shows the outfit stage'); fits('Builder');
if (tap('[data-swap]')) { await wait(500); fits('Pick list'); await close(); }
for (const t of ['Calendar', 'Week']) { tap('nav [data-go="outfits"]'); await wait(700); const b = [...d().querySelectorAll('.subnav button')].find(x => x.textContent === t); b?.click(); await wait(500); fits(`Favorites tab · ${t}`); }
// deeper flows: select mode, long-press, capsule editing, piece Adjust, pattern review, build possibilities
tap('nav [data-go="closet"]'); await wait(900);
if (tap('[data-action="selmode"]')) { await wait(300); tap('[data-selitem]'); await wait(300); fits('Select mode'); tap('[data-action="selmode"]'); await wait(300); }
{ const it = d().querySelector('.item[data-open]'); if (it) { it.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, clientX: 60, clientY: 400 })); await wait(650); it.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true })); await wait(300); log(!!d().querySelector('#sheet .quick'), 'Long-press opens quick actions'); await close(); } }
if (tap('[data-action="capsules"]')) { await wait(400); if (d().querySelector('[data-capedit]')) { tap('[data-capedit]'); await wait(400); log(!!d().querySelector('#sheet .pickgrid'), 'Capsule pieces picker opens'); fits('Capsule picker'); } await close(); }
if (tap('.item[data-open]')) { await wait(500); if (tap('[data-edit]')) { await wait(600); log(!!d().getElementById('ec'), 'Adjust photo opens'); } await close(); }
if (d().querySelector('[data-action="patreview"]')) { tap('[data-action="patreview"]'); await wait(400); log(!!d().querySelector('[data-patset]'), 'Pattern review opens'); fits('Pattern review'); await close(); }
tap('nav [data-go="build"]'); await wait(900); if (!d().querySelector('.stage .sp:not(.add)')) { tap('.starters [data-buildkey]'); await wait(800); }
if (tap('[data-action="possible"]')) { await wait(1500); fits('Outfit possibilities'); await close(); }
tap('nav [data-go="me"]'); await wait(800); log(!!d().querySelector('[data-go="inspo"]'), 'Me links to Inspo'); fits('Me');
if (tap('[data-go="inspo"]')) { await wait(2500); fits('Inspo'); // the board makes thumbnails: they must never land in the closet as pieces
  const items = await new Promise(r => { const q = w.indexedDB.open('closet'); q.onsuccess = () => { const g = q.result.transaction('items').objectStore('items').getAll(); g.onsuccess = () => r(g.result); }; });
  log(items.every(i => i.cat && typeof i.color === 'string' && typeof i.name === 'string'), `every closet piece has a type, color and name (${items.filter(i => !i.cat).length} without)`); }
log(!errors.length, errors.length ? `errors: ${errors.join(' | ')}` : 'no errors');
document.getElementById('sum').textContent = fails ? `${fails} problem${fails > 1 ? 's' : ''}` : 'All good';
document.title = fails ? `✕ ${fails}` : '✓ all good';
</script>
