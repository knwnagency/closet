const NOT_SPORTY = /loafer|dress shoe|boot|blazer|coat|button|trouser|chino|sweater|quarter zip|flannel|leather|overshirt|polo|skirt/i;
const NOT_DRESSY = /t-shirt|hoodie|sweatpants|sweatshirt|jogger|sneaker|running|jersey|tank|shorts|cargo|jort|slide|sandal|slipper|cap|beanie|bucket|track/i;
function sane(t) {

  if (NOT_SPORTY.test(t.kind)) v = v.filter(x => x !== 'athletic');

  t.vibe = v.length > 1 ? v : v[0] ?? 'casual';

// Phone photos are 12–48 MP: shrink before the cutout model sees them (memory + speed). Also bakes in EXIF rotation.
async function shrink(file, max = 1500) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close?.(); // JPEG has no alpha: a cut-out PNG would go black

const segment = async url => { const out = await (await loadSeg())(url); return (Array.isArray(out) ? out[0] : out).toBlob('image/png'); };

// photo → { img (cutout), color, photo (kept for Re-cut), tags }. Used by uploads, Replace photo and Re-cut.
// Tags first, from the original photo (93% right vs ~43% on the cutout), so the cleanup knows a shoe pair from a cap + its bag.
async function cutout(file, status = () => {}, known = null) {
  const photo = await shrink(file), url = await toDataUrl(photo);
  onDownload = pct => status(`Downloading AI ${Math.round(pct)}%`);
  let tags = known, cut = photo;
  if (!tags) { status('Tagging…'); try { tags = await tag(url); } catch (e) { console.warn(e); toast("Couldn't tag it. Set the tags yourself"); } }
  try { status('Removing background…'); cut = await segment(url); }
  catch (e) { console.warn(e); toast('Background removal failed. Kept the photo'); }
  return { ...((await prep(cut, false, tags, photo)) ?? (await prep(photo, true))), photo, tags };
}

let fpDone;

// Catches doubles the photo check can't: two screenshots of the same product, or pieces restored without their photo.
const CFP_SAME = 16;
const backfillFp = () => fpDone ??= (async () => { for (const it of S.items) {

  if (!it.cfp) try { const b = await imgOf(it); if (b) it.cfp = await fpOf(b); await putQuiet('items', it); } catch (e) { console.warn(e); } }

const dupOf = it => !it.dupOk && it.cfp && S.items.find(o => o !== it && o.cfp && ((o.createdAt ?? 0) < (it.createdAt ?? 0) || ((o.createdAt ?? 0) === (it.createdAt ?? 0) && o.id < it.id)) && fpDist(o.cfp, it.cfp) <= CFP_SAME);

// Every picked photo is saved (shrunk) to the queue store first, so a crash, a call or a locked phone never loses the batch:
// the next open picks up where it stopped. A photo that was mid-way through twice in a row is dropped, so it can't crash the app forever.
async function addFiles(files, left = []) {
  const jobs = [...left, ...[...files].map(f => ({ id: uid(), file: f, name: f.name, url: URL.createObjectURL(f), status: 'Saving…', at: Date.now() }))];
  S.upTotal = (S.pending.length ? S.upTotal ?? 0 : 0) + jobs.length; S.pending.push(...jobs); const moved = S.view !== 'closet'; S.view = 'closet'; render(); if (moved || files.length) { scrollTo(0, 0); setTimeout(settle, 120); } // after the photo picker, iOS can leave the page shifted

    catch (e) { console.warn(e); } finally { if (j.status === 'Saving…') j.status = 'Waiting…'; document.querySelector(`[data-pending="${j.id}"] span`)?.replaceChildren(j.status); }

  running = true; skipped = added = 0;
  try { await backfillFp(); while (S.pending.length) await addOne(S.pending[0]); }
  finally { running = false; const msg = `Added ${added}${skipped ? ` · ${skipped} ${skipped === 1 ? 'was' : 'were'} already in your closet` : ''}`;
    if (added >= 20) toast(`${msg}. Save a backup now?`, { label: 'Back up', fn: exportBackup }); // a big haul lives only on this phone until backed up
    else if (skipped) toast(msg); }
}

async function addOne(j) {
  const status = s => { j.status = s; document.querySelector(`[data-pending="${j.id}"] span`)?.replaceChildren(s); };
  try {
    if (j.saved) await putQuiet('queue', { id: j.id, file: j.file, name: j.name, at: j.at, tries: (j.tries ?? 0) + 1 });
    const small = await shrink(j.file), fp = await fpOf(small);
    if (S.items.some(i => i.fp && fpDist(i.fp, fp) <= FP_SAME)) { skipped++; return; }
    const { img, color, accents, photo, tags, hard, turn, frame } = await cutout(small, status), cfp = await fpOf(img);
    if (S.items.some(i => i.cfp && fpDist(i.cfp, cfp) <= CFP_SAME)) { skipped++; return; }
    if (tags && (tags.pattern === 'graphic' || tags.pattern === 'allover') && !accents?.length) Object.assign(tags, { pattern: 'solid', patterned: false }); // no print colors found: a blank tee, not a print
    if (hard) toast('Tricky background. Light clothes cut out best on a dark, plain surface');
    const item = { ...(tags ? { ai: { kind: tags.kind, fit: tags.fit, pattern: tags.pattern } } : {}), id: j.id, img, photo, frame, fp, cfp, color, accents, orientChecked: true, ...(turn ? { turnHint: turn } : {}), ...(tags ?? { cat: 'Tops', name: 'New item', kind: '', vibe: 'casual', patterned: false, fit: 1 }), review: !tags || !!tags.unsure?.length, wears: 0, lastWorn: null, createdAt: Date.now() };
    try { item.thumb = await thumbOf(img); } catch (e) { console.warn(e); } // small preview now: full-size cut-outs in the grid eat the memory the AI needs
    await put('items', item); S.items.push(item); S.ideas = null; added++;
    if (S.coll) { const c = collById(S.coll); c.ids.push(item.id); await put('colls', c); toast(`Added to ${c.name}`); } // adding while inside a collection files it there too
  } catch (e) { console.warn(e); toast(`Couldn't read ${j.name}. Try a JPG`); } // one bad file never stops the batch
  finally { del('queue', j.id).catch(() => {}); URL.revokeObjectURL(j.url); S.pending = S.pending.filter(p => p !== j); S.pending.length ? renderSoon() : render(); }
}

async function paletteOf(blob) {
