<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#ebe7e0">
<title>Closet</title>
<style>
  /* Fashion house: warm stone neutrals, Helvetica, uppercase tracking, square corners, no shadows. The clothes are the only color. */
  :root {
    --bg: #ebe7e0; --s1: #f4f1ec; --tile: #e0dbd2; --ink: #1d1a17; --muted: #655e55; /* 5.2:1 on bg, 4.6:1 on tiles — WCAG AA */ --hair: rgb(29 26 23 / .12);
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; --r: 2px;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; } /* no double-tap zoom when tapping buttons fast */
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; border-radius: 0; transition: opacity .2s; }
  button:active { opacity: .6; }
  main { max-width: 820px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 18px 120px; }
  header { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 22px; }
  header .right { display: flex; gap: 14px; align-items: center; }
  h1 { font-size: 30px; letter-spacing: -.01em; margin: 4px 0 0; font-weight: 700; line-height: 1; text-transform: uppercase; }
  h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; margin: 38px 0 14px; display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--hair); }
  .sub { color: var(--muted); font-size: 13px; margin: -4px 0 16px; max-width: 46ch; }
  .eyebrow, .mono { font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .glass { background: var(--s1); border-radius: var(--r); }
  .spot { background: var(--tile); border-radius: var(--r); }

  .chips { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px 22px; padding: 0 18px; border-bottom: 1px solid var(--hair); }
  .chip { flex: none; padding: 0 0 10px; margin-bottom: -1px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); border-bottom: 1px solid transparent; }
  .chip.on { color: var(--ink); border-color: var(--ink); }
  .chip small { font-size: 10px; font-weight: 400; margin-left: 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 10px; }
  .item { text-align: left; align-self: start; }
  .item .ph { aspect-ratio: 3 / 4; display: grid; place-items: center; padding: 16%; position: relative; }
  .item .ph i { position: absolute; right: 10px; top: 10px; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .item img { width: 100%; height: 100%; min-height: 0; object-fit: contain; } /* min-height: tall photos must not stretch the 3:4 tile */
  .item b { display: block; margin-top: 10px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  .item span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pending .ph { overflow: hidden; }
  .pending img { opacity: .35; filter: grayscale(1); }
  .pending .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgb(255 255 255 / .45) 50%, transparent 65%); animation: sh 1.6s infinite; }
  @keyframes sh { from { transform: translateX(-100%) } to { transform: translateX(100%) } }

  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; margin: 0 0 10px; }
  .empty p { max-width: 36ch; margin: 0 auto 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 26px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; }
  .btn.ghost, .btn.danger { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .btn.go { background: var(--ink); color: var(--bg); }
  .btn.done { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--hair); }
  .btn.sm { height: 40px; padding: 0 18px; }
  .btn.wide { width: 100%; margin-top: 22px; }
  .btn.danger { color: #9b3b2e; box-shadow: inset 0 0 0 1px rgb(155 59 46 / .4); }

  .seg { display: inline-flex; gap: 16px; }
  .seg button { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding-bottom: 3px; border-bottom: 1px solid transparent; }
  .seg button.on { color: var(--ink); border-color: var(--ink); }
  .subnav { display: flex; margin: -6px 0 22px; }
  .backup { display: flex; justify-content: center; gap: 24px; margin-top: 48px; } .empty .backup { margin-top: 22px; }
  .blurb .row2 { display: flex; gap: 6px; flex: none; }
  .blurb { color: var(--muted); margin: -8px 0 18px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .anchor { display: inline-flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; background: var(--s1); margin-bottom: 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .anchor img { width: 34px; height: 34px; object-fit: contain; background: var(--tile); padding: 3px; }

  .streak { display: inline-flex; align-items: baseline; gap: 6px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); padding: 7px 9px; box-shadow: inset 0 0 0 1px var(--hair); }
  .streak b { font-size: 13px; letter-spacing: 0; color: var(--ink); }
  .streak.lit { background: var(--ink); color: var(--bg); box-shadow: none; } .streak.lit b { color: var(--bg); }

  /* ghost = a piece you don't own yet: a flat in its color */
  .gh { display: grid; place-items: center; }
  .gh svg { width: 100%; height: 100%; fill: var(--c); stroke: rgb(0 0 0 / .18); stroke-width: .3; }
  .meta { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .swatches { display: flex; gap: 3px; }
  .swatches i { width: 12px; height: 12px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .meta p { flex: 1; margin: 0 0 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .why { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 6px; color: var(--muted); }
  .why svg { width: 14px; height: 14px; flex: none; }
  .icon { width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
  .icon svg { width: 19px; height: 19px; }
  .icon.on svg { fill: var(--ink); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions .btn { flex: 1; }

  /* list + suggestions */
  .nudge { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; margin-bottom: 24px; text-align: left; }
  .nudge .gh { width: 54px; height: 54px; flex: none; background: var(--tile); padding: 6px; }
  .nudge div { flex: 1; min-width: 0; } .nudge b { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
  .plus { flex: none; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
  .gaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .gap { padding: 14px; }
  .gap-top { display: flex; align-items: center; gap: 12px; }
  .gap-top .gh { width: 52px; height: 52px; flex: none; background: var(--tile); padding: 6px; }
  .gap-top div { flex: 1; min-width: 0; } .gap-top b { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 12px; }
  .scan { display: grid; place-items: center; gap: 16px; padding: 90px 20px; }
  .scan i { width: 40px; height: 1px; background: var(--ink); animation: load 1s ease-in-out infinite alternate; transform-origin: left; }
  @keyframes load { from { transform: scaleX(.1) } to { transform: scaleX(1) } }
  .wishform { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 8px; }
  .wishform input[name=name] { grid-column: 1 / -1; }
  .wishform input[name=price] { grid-column: 2 / -1; }
  .wishform input:not([type=color]), .wishform select { height: 46px; border: 0; border-bottom: 1px solid var(--ink); background: none; padding: 0 2px; font-size: 16px; outline: 0; border-radius: 0; appearance: none; } /* <16px makes iOS zoom on focus */
  .wishform select { padding-right: 18px; border-bottom-color: var(--hair);
    background: linear-gradient(45deg, transparent 50%, var(--ink) 50%) right 4px center / 5px 5px no-repeat, linear-gradient(-45deg, transparent 50%, var(--ink) 50%) right 0 center / 5px 5px no-repeat; }
  .wishform input[type=color] { width: 46px; height: 46px; border: 0; padding: 8px; background: none; }
  .wishform input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } .wishform input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .15); }
  .wish { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .wish .gh { width: 64px; height: 80px; flex: none; background: var(--tile); padding: 10px; }
  .wish div { flex: 1; min-width: 0; } .wish b { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .wish.got { opacity: .45; } .wish.got b { text-decoration: line-through; }
  .check { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--ink); display: grid; place-items: center; flex: none; }
  .check svg { width: 14px; height: 14px; opacity: 0; } .got .check { background: var(--ink); color: var(--bg); } .got .check svg { opacity: 1; }
  .x { color: var(--muted); font-size: 18px; width: 28px; flex: none; }

  /* progress */
  .hud { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 22px 20px; gap: 10px; }
  .hud .big { font-size: 112px; line-height: .82; font-weight: 700; letter-spacing: -.05em; }
  .hud .stats { display: grid; gap: 14px; text-align: right; }
  .hud .stats b { display: block; font-size: 22px; font-weight: 700; margin-top: 2px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
  .week div { display: grid; justify-items: center; gap: 8px; padding: 12px 0; background: var(--s1); }
  .week i { width: 14px; height: 14px; box-shadow: inset 0 0 0 1px var(--hair); }
  .week .on i { background: var(--ink); box-shadow: none; }
  .week .now span { color: var(--ink); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 4px; }
  .badge { display: grid; align-content: start; justify-items: center; text-align: center; gap: 8px; padding: 18px 8px 16px; }
  .medal { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--hair); color: var(--muted); }
  .medal svg { width: 20px; height: 20px; stroke-width: 1.3; }
  .badge.done { background: var(--ink); color: var(--bg); } .badge.done .medal { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .3); color: var(--bg); }
  .badge b { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .badge:not(.done) b { color: var(--muted); }
  .badge small { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .badge.done small, .badge.done .mono { color: rgb(255 255 255 / .55); }
  .bar { width: 60%; height: 1px; background: var(--hair); }
  .bar i { display: block; height: 100%; background: var(--ink); }

  /* color wheel */
  .wheel { position: relative; width: min(300px, 80vw); aspect-ratio: 1; margin: 6px auto 20px; border-radius: 50%; touch-action: none; cursor: crosshair;
    background: radial-gradient(closest-side, #fff, rgb(255 255 255 / 0)), conic-gradient(hsl(0 100% 50%), hsl(60 100% 50%), hsl(120 100% 50%), hsl(180 100% 50%), hsl(240 100% 50%), hsl(300 100% 50%), hsl(360 100% 50%)); }
  .wheel svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .wheel .h { position: absolute; width: 24px; height: 24px; margin: -12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .2); pointer-events: none; }
  .wheel .h.base { width: 34px; height: 34px; margin: -17px; }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  .light { display: flex; align-items: center; gap: 12px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .pal { display: flex; gap: 4px; margin: 20px 0 0; }
  .pal div { flex: 1; height: 120px; display: flex; flex-direction: column; justify-content: end; padding: 10px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .pal small { font-weight: 400; opacity: .75; }
  .match { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 4px; }
  .match > i { width: 30px; height: 30px; border-radius: 50%; flex: none; }
  .match .thumbs { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .match .thumbs button img { width: 52px; height: 64px; object-fit: contain; background: var(--tile); padding: 4px; display: block; }
  .match em { color: var(--muted); font-size: 12px; font-style: normal; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: stretch; background: rgb(235 231 224 / .92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--hair); padding-bottom: env(safe-area-inset-bottom); }
  nav .tabs { flex: 1; display: flex; max-width: 820px; margin: 0 auto; }
  nav .tabs button { flex: 1; min-width: 0; height: 58px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); position: relative; }
  nav .tabs button.on { color: var(--ink); }
  nav .tabs button.on::after { content: ''; position: absolute; left: 50%; bottom: 14px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink); }
  nav .add { width: 52px; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--bg); }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

  /* sheet */
  dialog.sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh; border: 0; padding: 0; border-radius: 0; background: var(--bg); color: var(--ink); }
  dialog.sheet[open] { animation: up .45s cubic-bezier(.2, .9, .25, 1); }
  @keyframes up { from { transform: translateY(100%) } }
  dialog::backdrop { background: rgb(29 26 23 / .35); }
  .sheet .hero { height: 280px; display: grid; place-items: center; padding: 40px; position: relative; border-radius: 0; }
  .sheet .hero img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
  .sheet .close { position: absolute; top: 12px; right: 12px; }
  .sheet form { padding: 20px 18px calc(env(safe-area-inset-bottom) + 22px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .sheet .stat { text-align: center; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .group { border-top: 1px solid var(--hair); }
  .cell { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--hair); }
  .cell > span:first-child { flex: none; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; }
  .cell input:not([type]), .cell select { flex: 1; min-width: 0; border: 0; background: none; text-align: right; text-align-last: right; color: var(--ink); appearance: none; font-size: 16px; height: 52px; outline: 0; border-radius: 0; }
  .cell select { padding-right: 16px; background: linear-gradient(45deg, transparent 50%, var(--muted) 50%) right 4px center / 5px 5px no-repeat, linear-gradient(-45deg, transparent 50%, var(--muted) 50%) right 0 center / 5px 5px no-repeat; }
  .cell .cname { flex: 1; text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .swatches { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 14px; border-bottom: 1px solid var(--hair); }
  .swatches button { flex: none; width: 30px; height: 30px; border-radius: 50%; position: relative; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .15); }
  .swatches button span { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); font-size: 8.5px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; color: var(--muted); display: none; }
  .swatches button.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); } .swatches button.on span { display: block; }
  .swatches:has(.on) { padding-bottom: 26px; }
  .cell input[type=color] { width: 26px; height: 26px; border: 0; padding: 0; border-radius: 50%; background: none; flex: none; }
  .cell input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } .cell input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .15); }
  .switch { appearance: none; margin: 0 0 0 auto; width: 44px; height: 24px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--ink); position: relative; flex: none; cursor: pointer; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .25s cubic-bezier(.3, .7, .4, 1), background .2s; }
  .switch:checked { background: var(--ink); } .switch:checked::after { transform: translateX(20px); background: var(--bg); }

  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 14px); transform: translate(-50%, -180%); background: var(--ink); color: var(--bg); padding: 13px 20px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; transition: transform .35s cubic-bezier(.2, .9, .3, 1); z-index: 9; max-width: 92vw; white-space: nowrap; }
  #toast.show { transform: translate(-50%, 0); }

  /* flat-lay outfit: pieces laid out at real-world scale, never overlapping (flatLayout in match.js) */
  .flat { position: relative; aspect-ratio: 4 / 5; background: var(--tile); overflow: hidden; border-radius: var(--r); }
  .flat > img, .flat > .gh { position: absolute; object-fit: contain; min-height: 0; }
  .feed > .outfit:first-child { grid-column: 1 / -1; } .feed > .outfit:first-child .flat { max-width: 520px; margin: 0 auto; } /* lead idea big enough to see the cap and chain */
  .flatbtn { display: block; width: 100%; }
  .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px 10px; }
  .outfit .meta { margin-top: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
  button:disabled { opacity: .3; pointer-events: none; }

  /* builder: one card per slot */
  .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 520px; margin: 0 auto; }
  .bcard { display: flex; flex-direction: column; background: var(--s1); border-radius: var(--r); padding: 10px 10px 4px; min-width: 0; }
  .bcard .lab { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .bcard .pic { display: block; width: 100%; height: 150px; padding: 8px; } .bcard .pic img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
  .bcard .nm { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcard .ops { display: flex; justify-content: space-between; margin-top: auto; } .bcard .ops button { height: 40px; font-size: 12px; } .bcard .ops button:last-child { color: var(--muted); }
  .bcard.add { justify-content: center; align-items: center; gap: 2px; min-height: 238px; background: none; box-shadow: inset 0 0 0 1px var(--hair); font-size: 13px; }
  .bcard.add b { font-size: 26px; font-weight: 300; line-height: 1; } .bcard.add small { font-size: 11px; color: var(--muted); }
  .bgrid.small .bcard.add { aspect-ratio: auto; min-height: 150px; } .bgrid.small .bcard .pic { height: 90px; }
  .pickh { padding: 0 18px; margin: 4px 0 8px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .actions .icon.on svg { fill: var(--bg); }
  .looks { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px 2px; }
  .looks .look { flex: 0 0 92px; position: relative; } .looks .look > button:first-child { display: block; width: 100%; }
  .looks .look .icon { position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; } .looks .look .icon svg { width: 15px; height: 15px; }
  .looks-h { display: flex; justify-content: space-between; margin: 26px 0 10px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; } .looks-h span:last-child { color: var(--muted); font-weight: 500; }
  .accs { display: flex; gap: 6px; margin-left: auto; } .accs button { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .15); }
  /* week planner */
  .weekbar { display: flex; justify-content: space-between; align-items: center; margin: 0 0 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }

  'jeans': 'Bottoms', 'trousers': 'Bottoms', 'shorts': 'Bottoms', 'sweatpants': 'Bottoms', 'cargo pants': 'Bottoms', 'skirt': 'Bottoms',
  'sneakers': 'Shoes', 'boots': 'Shoes', 'loafers': 'Shoes', 'sandals': 'Shoes', 'slippers': 'Shoes',
  'baseball cap': 'Accessories', 'beanie': 'Accessories', 'bag': 'Accessories', 'watch': 'Accessories', 'chain necklace': 'Accessories', 'bracelet': 'Accessories', 'sunglasses': 'Accessories', 'belt': 'Accessories',
};
const VIBES = { streetwear: 'streetwear', formal: 'formal dress clothing', casual: 'casual everyday clothing', athletic: 'athletic sportswear' };
// Fit prompts, index = fit value (0 slim/sleek, 1 regular, 2 baggy/chunky)
const FIT_PROMPTS = { Shoes: ['sleek low-profile', 'regular', 'chunky thick-soled'], Bottoms: ['slim skinny', 'straight leg', 'baggy wide-leg'], default: ['slim fitted', 'regular fit', 'oversized baggy boxy'] };

async function tag(dataUrl) {
  const c = await loadClf();
  const top = async (labels, t) => (await c(dataUrl, labels, { hypothesis_template: t }))[0].label;
  const kind = await top(Object.keys(KINDS), 'a product photo of {}');
  const cat = KINDS[kind];
  const v = await top(Object.values(VIBES), 'a photo of {}');
  const pat = await top(['plain solid-color clothing', 'clothing with a graphic print, logo, or pattern'], 'a photo of {}');
  const fp = (FIT_PROMPTS[cat] ?? FIT_PROMPTS.default).map(p => `${p} ${kind}`);
  const fit = cat === 'Accessories' ? 1 : fp.indexOf(await top(fp, 'a photo of {}'));
  return {
    kind, cat, fit, name: kind[0].toUpperCase() + kind.slice(1),
    vibe: Object.keys(VIBES).find(k => VIBES[k] === v), patterned: pat.startsWith('clothing with'),
  };
}

// Downscale, clean the mask, crop to the garment, pick its dominant color.
// raw = the uncut photo (cutout failed): keep it whole and read the color from the middle, where the piece usually is.
async function prep(blob, raw = false, tags = null) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = Object.assign(document.createElement('canvas'), { width: w, height: h }), ctx = cv.getContext('2d');
  ctx.drawImage(bmp, 0, 0, w, h);
  const im = ctx.getImageData(0, 0, w, h), d = im.data, buckets = new Map(), px = [];
  if (!raw) {
    // A tee photo keeps one piece (not the bag or box beside it), shoes keep the pair; chains/bags stay open and multi-part.
    const open = tags?.cat === 'Accessories' && !isHat(tags), pieces = !tags ? Infinity : tags.cat === 'Shoes' ? 2 : open ? Infinity : 1;
    // ponytail: too little left = the model ate the piece (white tee on a white sheet) → fall back to the photo. Fixed cutoffs; tune if small accessories fall back.
    if (cleanAlpha(d, w, h, { pieces, fill: !open }) < (['Tops', 'Layers', 'Bottoms'].includes(tags?.cat) ? 0.1 : 0.04)) return null;
    ctx.putImageData(im, 0, 0);
  }
  const mid = (x, y) => !raw || (x > w / 4 && x < w * 3 / 4 && y > h / 4 && y < h * 3 / 4);
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (d[i + 3] < 30) continue;
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    if (d[i + 3] < 220 || (x | y) & 3 || !mid(x, y)) continue; // sample every 4th solid pixel
    px.push([d[i], d[i + 1], d[i + 2]]);
    const key = (d[i] >> 5) << 6 | (d[i + 1] >> 5) << 3 | d[i + 2] >> 5, b = buckets.get(key) ?? [0, 0, 0, 0];
    b[0]++; b[1] += d[i]; b[2] += d[i + 1]; b[3] += d[i + 2]; buckets.set(key, b);
  }
  if (x1 < x0) return null; // cutout erased everything (white tee on a white sheet)
  // ponytail: most common color bucket wins — shadows/linings can steal it; user fixes via the color picker.
  const [n, r, g, b] = [...buckets.values()].sort((a, b) => b[0] - a[0])[0] ?? [1, 128, 128, 128];
  const color = '#' + [r, g, b].map(v => Math.round(v / n).toString(16).padStart(2, '0')).join('');
  const pad = 12, cw = x1 - x0 + 1 + pad * 2, ch = y1 - y0 + 1 + pad * 2;
  const out = Object.assign(document.createElement('canvas'), { width: cw, height: ch });
  out.getContext('2d').drawImage(cv, x0, y0, cw - pad * 2, ch - pad * 2, pad, pad, cw - pad * 2, ch - pad * 2);
  const img = await new Promise(r => out.toBlob(r, 'image/webp', 0.9)); // Safari falls back to PNG, fine
  return { img, color, accents: accentsOf(extractPalette(px, 6, 0.02), color) }; // the colors in a graphic/print besides the base
}

// Phone photos are 12–48 MP: shrink before the cutout model sees them (memory + speed). Also bakes in EXIF rotation.
async function shrink(file, max = 1500) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close?.(); // JPEG has no alpha: a cut-out PNG would go black
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
}

const segment = async url => { const out = await (await loadSeg())(url); return (Array.isArray(out) ? out[0] : out).toBlob('image/png'); };

// photo → { img (cutout), color, photo (kept for Re-cut), tags }. Used by uploads, Replace photo and Re-cut.
// Tags first, from the original photo (93% right vs ~43% on the cutout), so the cleanup knows a shoe pair from a cap + its bag.
async function cutout(file, status = () => {}, known = null) {
  const photo = await shrink(file), url = await toDataUrl(photo);
  onDownload = pct => status(`Downloading AI ${Math.round(pct)}%`);
  let tags = known, cut = photo;
  if (!tags) { status('Tagging…'); try { tags = await tag(url); } catch (e) { console.warn(e); toast('Auto-tag failed — set it in review'); } }
  try { status('Removing background…'); cut = await segment(url); }
  catch (e) { console.warn(e); toast('Background removal failed — kept original'); }
  return { ...((await prep(cut, false, tags)) ?? (await prep(photo, true))), photo, tags };
}

let running = false;
async function addFiles(files) {
  S.pending.push(...[...files].map(f => ({ id: uid(), file: f, url: URL.createObjectURL(f), status: 'Waiting…' })));
  S.view = 'closet'; render();
  if (running) return; // one queue: two models at once would eat a phone's memory
  running = true;
  try { while (S.pending.length) await addOne(S.pending[0]); } finally { running = false; }
}

async function addOne(j) {
  const status = s => { j.status = s; document.querySelector(`[data-pending="${j.id}"] span`)?.replaceChildren(s); };
  try {
    const { img, color, accents, photo, tags } = await cutout(j.file, status);
    const item = { id: j.id, img, photo, color, accents, ...(tags ?? { cat: 'Tops', name: 'New item', kind: '', vibe: 'casual', patterned: false, fit: 1 }), review: true, wears: 0, lastWorn: null, createdAt: Date.now() };
    await put('items', item); S.items.push(item); S.ideas = null;
    if (S.coll) { const c = collById(S.coll); c.ids.push(item.id); await put('colls', c); toast(`Added to ${c.name}`); } // adding while inside a collection files it there too
  } catch (e) { console.warn(e); toast(`Couldn't read ${j.file.name} — try a JPG`); } // one bad file never stops the batch
  finally { URL.revokeObjectURL(j.url); S.pending = S.pending.filter(p => p !== j); render(); }
}

// Picture turned q × 90° clockwise. PNG, so turning 4× gives back the same picture.
async function turnBlob(blob, q) {
  if (!(q % 4)) return blob;
  const bmp = await createImageBitmap(blob), c = Object.assign(document.createElement('canvas'), { width: q % 2 ? bmp.height : bmp.width, height: q % 2 ? bmp.width : bmp.height }), x = c.getContext('2d');
  x.translate(c.width / 2, c.height / 2); x.rotate(q * Math.PI / 2); x.drawImage(bmp, -bmp.width / 2, -bmp.height / 2);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
// Taps queue up (two quick taps = two turns) and the turn count is kept, so Re-cut from the original photo comes out the same way up.
let turning = Promise.resolve();
const rotate = it => turning = turning.then(async () => { it.img = await turnBlob(it.img, 1); it.turns = ((it.turns ?? 0) + 1) % 4; resetSrc(it); await put('items', it); });

// ---------- inspo: pull the outfit's colors (person only, background masked out) ----------
async function paletteOf(blob) {
  const bmp = await createImageBitmap(blob), k = Math.min(1, 160 / Math.max(bmp.width, bmp.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) }), x = c.getContext('2d');
  x.drawImage(bmp, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height).data, px = [];
  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200) px.push([d[i], d[i + 1], d[i + 2]]);
  return extractPalette(px, 6, 0.05).map(c => c.hex);
}
// ponytail: hue/sat/light box for skin and hair-free faces; tan or camel clothes land here too — one tap turns them back on.
const isSkin = hex => { const { h, s, l } = hexToHsl(hex); return h >= 5 && h <= 40 && s >= 0.2 && s <= 0.65 && l >= 0.35 && l <= 0.82; };
async function addInspo(files) {
  for (const f of files) {
    toast('Reading the colors…');
    try {
      const photo = await shrink(f, 1200), url = await toDataUrl(photo);
      let person = null;
      try { person = await segment(url); } catch (e) { console.warn(e); } // no model → whole pic
      const palette = await paletteOf(person ?? photo), ins = { id: uid(), img: photo, palette, off: palette.filter(isSkin), at: Date.now() };
      await put('inspo', ins); S.inspo.push(ins); render();
    } catch (e) { console.warn(e); toast(`Couldn't read ${f.name}`); }
  }
}

  const f = document.getElementById('obsizes')?.elements, measure = { ...(S.profile?.measure ?? {}) };
  if (f) for (const k of ['top', 'bottom', 'shoe']) if (f[k].value.trim()) measure[k] = f[k].value.trim();
  S.profile = { k: 'me', done: true, styles: S.ob.styles, goals: S.ob.goals, measure };
  await put('profile', S.profile);
  if (!S.colls.length) for (const name of ['Everyday', 'Vacation', 'Club', 'Dressy']) { const c = { id: uid(), name, ids: [], at: Date.now() }; await put('colls', c); S.colls.push(c); }
  S.mode = defaultMode(S.profile); S.ideas = null; S.view = S.items.length ? 'outfits' : 'closet'; render(); scrollTo(0, 0);
}

// Wheel drag: angle from 12 o'clock = hue, distance from center = saturation (same as the CSS conic gradient).
function wheelAt(e) {
  const r = document.getElementById('wheel').getBoundingClientRect(), dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;
  S.wheel.h = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
  S.wheel.s = Math.min(1, Math.hypot(dx, dy) / (r.width / 2));
  paintWheel();
}
document.addEventListener('pointerdown', e => { if (e.target.id === 'wheel') { S.dragging = true; wheelAt(e); } });
document.addEventListener('pointermove', e => { if (S.dragging) wheelAt(e); });
document.addEventListener('pointerup', () => { S.dragging = false; });
document.addEventListener('input', async e => {
  if (e.target.id === 'light') { S.wheel.l = +e.target.value; paintWheel(); }
  if (e.target.form?.id === 'measure') { S.profile ??= { k: 'me', done: true, styles: [], goals: [] }; (S.profile.measure ??= {})[e.target.name] = e.target.value.slice(0, 80); await put('profile', S.profile); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.elements;
  if (e.target.id === 'wishform') {
    const name = f.name.value.trim(), price = parseFloat(f.price.value.replace(/[^0-9.]/g, '')), link = f.link.value.trim();
    if (!name) return;
    const w = { id: uid(), name, cat: f.cat.value, color: f.color.value, got: false, at: Date.now(), price: price > 0 ? price : null, link: /^https?:\/\//.test(link) ? link : null };
    await put('wish', w); S.wish.push(w); render(); document.querySelector('#wishform input')?.focus();
  } else if (e.target.id === 'newcoll') {
    const name = f.name.value.trim(); if (!name) return;
    const c = { id: uid(), name, ids: [], at: Date.now() };
    await put('colls', c); S.colls.push(c); S.coll = c.id; S.ideas = null; openPicker();
  }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const ds = t.dataset;
  if (ds.go) { S.view = ds.go; if (ds.listtab) S.listTab = ds.listtab; render(); scrollTo(0, 0); }
  else if (ds.sub) { const [k, v] = ds.sub.split(':'); S[k] = v; render(); }
  else if (ds.ob) { if (ds.ob === 'next') { S.ob.step++; render(); scrollTo(0, 0); } else finishOnboarding(); }
  else if (ds.obpick) { const [g, k] = ds.obpick.split(':'), a = S.ob[g]; a.includes(k) ? a.splice(a.indexOf(k), 1) : a.push(k); render(); }
  else if (ds.action === 'redo') { S.ob = { step: 1, styles: [...(S.profile?.styles ?? [])], goals: [...(S.profile?.goals ?? [])] }; S.view = 'onboard'; render(); scrollTo(0, 0); }
  else if (ds.listtab) { S.listTab = ds.listtab; render(); }
  else if (ds.wishgap) {
    if (onList(ds.wishgap)) return;
    const g = getGaps()?.find(x => x.ghost.id === ds.wishgap)?.ghost; if (!g) return;
    const w = { id: g.id, name: g.name, cat: g.cat, color: g.color, fit: g.fit, got: false, at: Date.now() };
    await put('wish', w); S.wish.push(w); toast('Added to list'); render();
  }
  else if (ds.wishgot) { const w = S.wish.find(x => x.id === ds.wishgot); w.got = !w.got; await put('wish', w); if (w.got) toast('Copped — add a photo with +'); render(); }
  else if (ds.wishdel) { await del('wish', ds.wishdel); S.wish = S.wish.filter(x => x.id !== ds.wishdel); render(); }
  else if (ds.action === 'add') fileInput.click();
  else if (ds.action === 'addinspo') inspoInput.click();
  else if (ds.action === 'export') exportBackup();
  else if (ds.action === 'import') restoreInput.click();
  else if (ds.action === 'review') { const n = S.items.find(i => i.review); if (n) openSheet(n.id); }
  else if (ds.confirm) {
    const it = byId(ds.confirm); delete it.review; await put('items', it);
    const next = S.items.find(i => i.review);
    if (next) openSheet(next.id); else { sheet.close(); toast('All pieces checked'); }
  }
  else if (ds.action === 'shuffle') { S.ideas = null; render(); }
  else if (ds.action === 'unanchor') { S.anchor = null; S.ideas = null; render(); }
  else if (ds.action === 'close') sheet.close();
  else if (ds.action === 'build') startBuild(S.ideas?.[0]?.items);
  else if (ds.buildkey) { if (sheet.open) sheet.close(); startBuild(outfitByKey(ds.buildkey)?.items); }
  else if ('coll' in ds) { S.coll = ds.coll || null; S.cat = 'All'; S.ideas = null; render(); }
  else if (ds.action === 'newcoll') openNewColl();
  else if (ds.collname) sheet.querySelector('input[name=name]').value = ds.collname;
  else if (ds.action === 'collpick') openPicker();
  else if (ds.action === 'collfits') { S.view = 'outfits'; S.tab = 'ideas'; S.ideas = null; render(); scrollTo(0, 0); }
  else if (ds.action === 'uncoll') { S.coll = null; S.ideas = null; render(); }
  else if (ds.action === 'colldel') {
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Tap to confirm'; return; }
    await del('colls', S.coll); S.colls = S.colls.filter(c => c.id !== S.coll); S.coll = null; S.ideas = null; render();
  }
  else if (ds.collitem) {
    const c = collById(ds.collid ?? S.coll), id = ds.collitem;
    c.ids = c.ids.includes(id) ? c.ids.filter(x => x !== id) : [...c.ids, id];
    await put('colls', c); t.classList.toggle('on', c.ids.includes(id)); S.ideas = null;
  }
  else if (ds.harmony) { S.wheel.harmony = ds.harmony; render(); }
  else if (ds.cat) { S.cat = ds.cat; render(); }
  else if (ds.mode) { S.mode = ds.mode; S.ideas = null; render(); }
  else if (ds.open) openSheet(ds.open);
  else if (ds.setcolor) { const [id, h] = ds.setcolor.split('|'), it = byId(id); it.color = h; if (it.accents) it.accents = it.accents.filter(a => colorDist(a, h) > 90);
    sheet.querySelector('[name=color]').value = h; showColor(it); S.ideas = null; await put('items', it); }
  else if (ds.vibe) { const [id, v] = ds.vibe.split('|'), it = byId(id), cur = vibes(it), next = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];
    if (!next.length) return toast('Keep at least one vibe');
    it.vibe = next.length === 1 ? next[0] : next; t.classList.toggle('on', next.includes(v)); S.ideas = null; await put('items', it); }
  else if (ds.swap) openSwap(ds.swap);
  else if (ds.unwear) { S.build = S.build.filter(p => !SLOTS[ds.unwear](p)); render(); }
  else if (ds.wearpick) { const [slot, id] = ds.wearpick.split(':'); S.build = [...S.build.filter(p => !SLOTS[slot](p)), byId(id)]; sheet.close(); remember(S.build); render(); }
  else if (ds.rotate) { const it = byId(ds.rotate); await rotate(it); const im = sheet.querySelector('.hero img'); if (im) im.src = src(it); S.ideas = null; }
  else if (ds.replace) { replacing = ds.replace; replaceInput.click(); }
  else if (ds.recut) {
    const it = byId(ds.recut); t.disabled = true; toast('Removing background…');
    if (!it.photo) Object.assign(it, { photo: it.img, turns: 0 }); // imported pieces have no original: start from the picture as it is (already turned)
    try { const { img, accents } = await cutout(it.photo, undefined, it); Object.assign(it, { img: await turnBlob(img, it.turns ?? 0), accents }); resetSrc(it); await put('items', it); S.ideas = null; if (sheet.open) openSheet(it.id); toast('Re-cut'); }
    catch (e) { console.warn(e); t.disabled = false; toast("Couldn't remove it — check your connection and try again"); }
  }
  else if (ds.touchup) touchUp(byId(ds.touchup));
  else if (ds.touch) touchAct(ds.touch);
  else if (ds.style) { S.anchor = ds.style; S.ideas = null; S.view = 'outfits'; S.tab = 'ideas'; sheet.close(); render(); scrollTo(0, 0); }
  else if (ds.wheel) {
    const { h, s, l } = hexToHsl(byId(ds.wheel).color);
    Object.assign(S.wheel, { h, s: Math.max(s, 0.25), l: Math.min(0.85, Math.max(0.15, l)) });
    S.view = 'inspo'; S.inspoTab = 'wheel'; sheet.close(); render(); scrollTo(0, 0);
  }
  else if (ds.action === 'paletteFits') {
    const { h, s, l, harmony: hk } = S.wheel;
    S.palette = [...new Set(harmony(h, s, l, hk).map(c => Math.round(c.h)))];
    S.mode = 'palette'; S.ideas = null; S.view = 'outfits'; S.tab = 'ideas'; render(); scrollTo(0, 0);
  }
  else if (ds.inspo) openInspo(ds.inspo);
  else if (ds.accdel) { const [id, h] = ds.accdel.split('|'), it = byId(id); it.accents = it.accents.filter(x => x !== h); await put('items', it); S.ideas = null; openSheet(id); }
  else if (ds.readlook) {
    const ins = S.inspo.find(x => x.id === ds.readlook); t.disabled = true; t.textContent = 'Reading the pieces…';
    try { ins.pieces = await readLook(ins, s => { t.textContent = s; }); await put('inspo', ins); } catch (e) { console.warn(e); toast("Couldn't read this photo"); }
    if (sheet.open) openInspo(ins.id);
  }
  else if (ds.lookdrop) { const [id, i] = ds.lookdrop.split('|'), ins = S.inspo.find(x => x.id === id); ins.pieces.splice(+i, 1); await put('inspo', ins); openInspo(id); }
  else if (ds.lookwish) {
    const [id, i] = ds.lookwish.split('|'), g = S.inspo.find(x => x.id === id).pieces[+i];
    const w = { id: uid(), name: g.name, cat: g.cat, color: g.color, fit: g.fit, kind: g.kind, got: false, at: Date.now(), price: null, link: shopUrl(g.name), from: `${id}:${i}` };
    await put('wish', w); S.wish.push(w); toast('Added to list'); openInspo(id);
  }
  else if (ds.lookbuild) { // your closest pieces; a missing top/bottoms/shoes falls back to the nearest color you own at all
    const ins = S.inspo.find(x => x.id === ds.lookbuild), ps = [];
    for (const g of ins.pieces) { const p = closestOwned(S.items, g) ?? (['Tops', 'Bottoms', 'Shoes'].includes(g.cat) ? closestOwned(S.items, g, Infinity) : null); if (p && !ps.some(q => slotOf(q) === slotOf(p))) ps.push(p); }
    for (const c of ['Tops', 'Bottoms', 'Shoes']) if (!ps.some(p => p.cat === c)) { const p = S.items.find(i => i.cat === c); if (p) ps.push(p); }
    sheet.close(); startBuild(ps);
  }
  else if (ds.week) { S.weekOff = (S.weekOff ?? 0) + +ds.week; render(); }
  else if (ds.plan) openPlanPicker(ds.plan);
  else if (ds.unplan) { S.plan.days[ds.unplan] = { key: '', ids: [] }; await savePlan(); render(); }
  else if (ds.planpick) {
    const [k, key] = ds.planpick.split('|'), r = openPlanPicker.list.find(x => x.key === key);
    await setPlan(k, { key, ids: r.ids }, document.getElementById('planrepeat')?.checked); sheet.close(); render(); toast('Planned');
  }
  else if (ds.planbuild) { sheet.close(); startBuild(); }
  else if (ds.action === 'planthis') openDayPicker();
  else if (ds.planday) { await setPlan(ds.planday, lookRec(S.build), document.getElementById('planrepeat')?.checked); sheet.close(); render(); toast(`Planned · ${i18nDay(ds.planday, dayKey())}`); }
  else if (ds.action === 'pack') { if (!complete(pool())) return toast('This collection needs a top, bottoms and shoes'); S.packDays = null; openPack(); }
  else if (ds.packdays) { const c = collById(S.coll); S.packDays = Math.min(21, Math.max(1, (S.packDays ?? c.trip?.days ?? 3) + +ds.packdays)); openPack(); }
  else if (ds.action === 'packgo') {
    const c = collById(S.coll), days = S.packDays ?? c.trip?.days ?? 3, r = packTrip(pool(), days);
    c.trip = { days, fits: r.fits.map(o => o.items.map(p => p.id)) }; c.packed = (c.packed ?? []).filter(id => r.pieces.some(p => p.id === id));
    await put('colls', c); S.packDays = null; openPack();
  }
  else if (ds.packcheck) { const c = collById(S.coll), s2 = new Set(c.packed ?? []); s2.has(ds.packcheck) ? s2.delete(ds.packcheck) : s2.add(ds.packcheck); c.packed = [...s2]; await put('colls', c); openPack(); }
  else if (ds.action === 'packplan') {
    const c = collById(S.coll), tm = dayAdd(dayKey(), 1), taken = c.trip.fits.filter((_, i) => plannedFor(dayAdd(tm, i))).length;
    if (taken && !t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = `Replaces ${taken} planned day${taken > 1 ? 's' : ''} — tap again`; return; }
    for (const [i, ids] of c.trip.fits.entries()) S.plan.days[dayAdd(tm, i)] = { key: ids.slice().sort().join(), ids };
    await savePlan(); sheet.close(); S.view = 'outfits'; S.tab = 'week'; S.weekOff = 0; render(); scrollTo(0, 0); toast(`${c.trip.fits.length} days planned`);
  }
  else if (ds.insoff) {
    const [id, h] = ds.insoff.split('|'), ins = S.inspo.find(x => x.id === id);
    ins.off = ins.off.includes(h) ? ins.off.filter(x => x !== h) : [...ins.off, h]; await put('inspo', ins); openInspo(id);
  }
  else if (ds.inspofits) {
    const ins = S.inspo.find(x => x.id === ds.inspofits);
    S.inspoColors = ins.palette.filter(h => !ins.off.includes(h)); S.mode = 'inspo'; S.ideas = null; S.anchor = null; S.view = 'outfits'; S.tab = 'ideas';
    sheet.close(); render(); scrollTo(0, 0);
  }
  else if (ds.inspodel) { await del('inspo', ds.inspodel); S.inspo = S.inspo.filter(x => x.id !== ds.inspodel); sheet.close(); render(); }
  else if (ds.del) {
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Tap again to delete'; return; }
    const uses = [...S.saved, ...Object.values(S.plan.days), ...Object.values(S.plan.weekly)].filter(r => r.ids.includes(ds.del)).length;
    await del('items', ds.del); S.items = S.items.filter(i => i.id !== ds.del);
    toast(uses ? `Deleted · it was in ${uses} favorite or planned look${uses > 1 ? 's' : ''}` : 'Deleted');
    if (S.anchor === ds.del) S.anchor = null;
    if (S.build) S.build = S.build.filter(p => p.id !== ds.del);
    S.ideas = null; sheet.close(); render();
  }
  else if (ds.save) {
    const i = S.saved.findIndex(s => s.key === ds.save);
    if (i >= 0) { await del('outfits', ds.save); S.saved.splice(i, 1); }
    else {
      const o = outfitByKey(ds.save); if (!o) return;
      const mode = S.view === 'build' ? bestMode(o.items)?.mode ?? 'custom' : S.mode;
      const rec = { key: ds.save, ids: o.items.map(x => x.id), mode, savedAt: Date.now() }; await put('outfits', rec); S.saved.unshift(rec); toast('Added to favorites');
    }
    if (sheet.open && openItem) { openSheet(openItem); return; }
    render();
  }
  else if (ds.wear) {
    const o = outfitByKey(ds.wear), day = dayKey(), prev = S.log.find(l => l.day === day); if (!o) return;
    if (prev?.key === o.key) return toast('Already logged for today');
    const before = new Set(badges(progressCtx()).filter(b => b.done).map(b => b.id));
    for (const id of prev?.ids ?? []) { const it = byId(id); if (it) { it.wears = Math.max(0, (it.wears || 1) - 1); await put('items', it); } } // swapping today's fit
    for (const it of o.items) { it.wears = (it.wears || 0) + 1; it.lastWorn = Date.now(); await put('items', it); }
    const mode = S.saved.find(x => x.key === o.key)?.mode ?? (S.view === 'build' ? bestMode(o.items)?.mode : S.mode) ?? 'custom';
    const entry = { day, key: o.key, ids: o.items.map(i => i.id), mode, at: Date.now() };
    await put('log', entry); S.log = [...S.log.filter(l => l.day !== day), entry];
    const fresh = badges(progressCtx()).find(b => b.done && !before.has(b.id));
    toast(fresh ? `Badge unlocked · ${fresh.name}` : prev ? "Swapped today's fit" : `Day ${streaks(S.log).cur} streak`);
    render();
  }
});

// Pieces added before print colors existed: read them once from the cutout, in the background.
async function backfillAccents() {
  let n = 0;
  for (const it of S.items.filter(i => !i.accents)) {
    try {
      const bmp = await createImageBitmap(it.img), k = Math.min(1, 240 / Math.max(bmp.width, bmp.height));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) }), x = c.getContext('2d');
      x.drawImage(bmp, 0, 0, c.width, c.height); const d = x.getImageData(0, 0, c.width, c.height).data, px = [];
      for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 220) px.push([d[i], d[i + 1], d[i + 2]]);
      it.accents = accentsOf(extractPalette(px, 6, 0.02), it.color); await put('items', it); n++;
    } catch (e) { console.warn(e); }
  }
  if (n) { S.ideas = null; if (S.view !== 'build') render(); }
}

render();
backfillAccents();
navigator.serviceWorker?.register('sw.js').catch(e => console.warn(e)); // opens with no signal once installed (sw.js)
</script>
